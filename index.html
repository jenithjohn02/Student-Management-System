<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduControl | Admin Portal</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="student-signup.css">
    <link rel="stylesheet" href="student-login.css">
</head>
<body>
    <div id="main-container">
        <div id="admin-login-section" class="card admin-card">
            <div class="header">
                <h2>Admin Login</h2>
                <p>Access management control</p>
            </div>
            <div class="form-group">
                <input type="text" id="admin-user" placeholder="Username">
                <input type="password" id="admin-pass" placeholder="Password">
                <button id="admin-login-btn" class="btn btn-admin">Login as Admin</button>
            </div>
            <div class="footer-links">
                <button onclick="showSection('signup')">Student Registration</button>
                <button onclick="showSection('student-login')">Student Login</button>
            </div>
        </div>

        <div id="admin-dashboard" class="dashboard hidden">
            <div class="dash-nav">
                <h3>Admin Dashboard</h3>
                <button class="btn btn-logout" id="admin-logout">Logout</button>
            </div>
            <div class="table-container">
                <table id="student-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Roll No</th>
                            <th>Email</th>
                            <th>Dept</th>
                            <th>Year</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="admin-student-list"></tbody>
                </table>
            </div>
        </div>

        <div id="signup-container"></div>
        <div id="student-login-container"></div>
    </div>

    <script src="admin.js"></script>
    <script src="student-signup.js"></script>
    <script src="student-login.js"></script>
</body>
</html>
